<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b14">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>JARVIS</h1>
      <div class="top-right">
        <span id="status" class="status" aria-live="polite">Idle</span>
        <button type="button" id="gear" class="ghost gear" aria-label="Settings kholo">⚙️</button>
      </div>
    </header>

    <section class="core-wrap" aria-hidden="true">
      <div id="core" class="core" data-state="idle">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="orb"></div>
      </div>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <div class="controls">
      <select id="lang" aria-label="Bhasha chuno">
        <option value="hi-IN">हिन्दी</option>
        <option value="en-IN">English</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="voiceOn" checked> Awaaz
      </label>
      <button type="button" id="stopSpeak" class="ghost">Stop</button>
    </div>

    <form id="form" class="input-bar">
      <button type="button" id="mic" class="mic" aria-label="Mic shuru ya band karo">🎤</button>
      <input id="text" type="text" maxlength="500" autocomplete="off"
             placeholder="Kuch likho ya bolo..." aria-label="Message likho">
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <!-- Settings panel -->
  <section id="settings" class="settings" hidden aria-label="Settings">
    <h2>Settings</h2>

    <label class="row">Awaaz ki speed: <b id="rateVal">1.0</b>
      <input type="range" id="rate" min="0.6" max="1.5" step="0.1" value="1">
    </label>

    <label class="row check">
      <input type="checkbox" id="saveHist">
      <span>Chat history is phone mein yaad rakho</span>
    </label>
    <p class="note">Ye sirf is browser mein save hoti hai, server par nahi. Private baatein save mat karo.</p>

    <div class="btns">
      <button type="button" id="wipe" class="ghost danger">Saara saved data delete karo</button>
      <button type="button" id="closeSettings">Band karo</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
