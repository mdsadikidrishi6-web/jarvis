<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b14">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>JARVIS</h1>
      <span id="status" class="status" aria-live="polite">Idle</span>
    </header>

    <section class="core-wrap" aria-hidden="true">
      <div id="core" class="core" data-state="idle">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="orb"></div>
      </div>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <div class="controls">
      <select id="lang" aria-label="Bhasha chuno">
        <option value="hi-IN">हिन्दी</option>
        <option value="en-IN">English</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="voiceOn" checked> Awaaz
      </label>
      <button type="button" id="stopSpeak" class="ghost">Stop</button>
    </div>

    <form id="form" class="input-bar">
      <button type="button" id="mic" class="mic" aria-label="Mic shuru ya band karo">🎤</button>
      <input id="text" type="text" maxlength="500" autocomplete="off"
             placeholder="Kuch likho ya bolo..." aria-label="Message likho">
      <button type="submit" id="send">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
